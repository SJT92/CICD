name: CI
on:
  push:
    branches: ["master"]

  permissions:
    content: read

env:
  DOTNET_VERSION: "10.0.x"
  SOLUTION: "CICD.sln"

jobs:
  Build-and-Test:
    name: Build-and-Test
    runs-on: ubuntu-latest

    steps:
    - name: Get Code
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore
      run: dotnet restore ${{ env.SOLUTION_PATH }}

    - name: Build
      run: dotnet build ${{ env.SOLUTION_PATH }} --no-restore --configuration Release

    - name: Test
      run: dotnet test ${{ env.SOLUTION_PATH }} --no-build --verbosity detailed --configuration Release --no-restore
